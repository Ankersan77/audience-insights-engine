name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_research_test
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canonical product documents
        run: pnpm check:source-of-truth

      - name: Validate product governance manifests
        run: pnpm check:governance

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply migrations and test PostgreSQL governance and authenticated HTTP
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/market_research_test
          TEST_HTTP: "1"
          TEST_NATIVE_BACKUP_RESTORE: "1"

      - name: Build production web and worker images
        run: |
          docker build --target web-runtime --build-arg APPLICATION_VERSION="$GITHUB_SHA" --tag "market-research-web:$GITHUB_SHA" .
          docker build --target worker-runtime --build-arg APPLICATION_VERSION="$GITHUB_SHA" --tag "market-research-worker:$GITHUB_SHA" .

      - name: Prepare isolated worker-image database
        run: |
          PGPASSWORD=isolated-test-only createdb -h 127.0.0.1 -U postgres market_research_worker_test
          DATABASE_URL=postgresql://postgres:isolated-test-only@127.0.0.1:5432/market_research_worker_test pnpm db:migrate

      - name: Verify production images, removed routes and worker lifecycle
        run: node scripts/verify-production-images.mjs
        env:
          WEB_IMAGE: market-research-web:${{ github.sha }}
          WORKER_IMAGE: market-research-worker:${{ github.sha }}
          TEST_WORKER_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/market_research_worker_test

      - name: Upload immutable R1A2 image inspection
        uses: actions/upload-artifact@v4
        with:
          name: r1a2-image-inspection-${{ github.sha }}
          path: artifacts/r1a2-image-inspection.json
          if-no-files-found: error
