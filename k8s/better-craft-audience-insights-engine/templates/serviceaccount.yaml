{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Name must match system:serviceaccount:better-craft:<app-name> in the IRSA
  # trust policy of this app's per-app Terraform, or the pod gets no AWS access.
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    project: better-craft
    app.kubernetes.io/part-of: better-craft
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    # Must sync before the workloads (deployment/worker/job all wave 2-3) that
    # reference serviceAccountName, or ArgoCD can create the pod before the SA
    # exists -- surfaces as "unable to create session: ServiceAccount not found"
    # in the exec/web-terminal (better-craft-regulatory-tool incident).
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
