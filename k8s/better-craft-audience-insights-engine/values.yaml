# RENAME every audience-insights-engine below: the repo name with the better-craft- prefix
# stripped (better-craft-my-app -> my-app).

image:
  repository: 227843491785.dkr.ecr.eu-west-1.amazonaws.com/better-craft/audience-insights-engine/production
  # Overridden by values_image_tag.yaml, which CI rewrites on every build.
  # This value is only the fallback for a standalone `helm template`.
  tag: latest

replicaCount: 1

service:
  port: 3000

# HTTP path used by the liveness/readiness probes and by the ALB target-group
# health check. Must be a real route in the app — see the note in the Dockerfile.
healthPath: /healthz

ingress:
  enabled: true
  className: better-craft-alb # dedicated better-craft ALB; the default and, for now, the only one
  host: audience-insights-engine.better-craft.bettercollective.dev
  # Name of the shared better-craft ALB. A platform-wide constant — every app
  # must set the identical value, since they all land on the same load balancer
  # and the first Ingress reconciled is the one that names it. Terraform in
  # Project/better-craft/.../common/dns resolves the wildcard DNS record by this
  # name (local.alb_name), so the two must stay in sync. Max 32 characters.
  loadBalancerName: platform-utilities-better-craft
  # Security group for the shared better-craft ALB, created by Terraform in
  # platform-utilities (module.better_craft_alb_sg, exposed as the
  # better_craft_alb_security_group_id output). Without this annotation the AWS
  # Load Balancer Controller attaches a managed group open to 0.0.0.0/0 and the
  # ALB stops being office/VPN-only. All ingresses sharing the ALB group must
  # set the same value.
  securityGroupId: "sg-001cb312e4202fb6d"

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

# Only needed if this app has its own AWS resources (per-app Terraform / IRSA).
# When create is true, the ServiceAccount name is .Chart.Name and must match the
# `system:serviceaccount:better-craft:<app-name>` condition in the IAM trust policy.
serviceAccount:
  create: false
  roleArn: ""
