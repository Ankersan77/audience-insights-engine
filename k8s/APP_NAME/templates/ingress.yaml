{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    project: better-craft
    app.kubernetes.io/part-of: better-craft
  annotations:
    # scheme and the TLS certificate come from the better-craft-alb
    # IngressClassParams, not from here.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath | default .Values.healthPath | quote }}
    alb.ingress.kubernetes.io/security-groups: {{ .Values.ingress.securityGroupId | quote }}
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    # Has to be here, not on the IngressClassParams — the controller ignores that
    # object's annotations. Whichever Ingress in the group is reconciled first
    # names the shared ALB; the rest just join it, so every app repeats the same
    # value. Terraform looks the ALB up by this exact name.
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # Declared for clarity and validation. The AWS Load Balancer Controller sources
  # the actual certificate from the IngressClassParams wildcard, not from here.
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
